  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  # esbuild <0.28.1 vulnerable to GHSA-g7r4-m6w7-qqqr (arbitrary file read)
  esbuild: "0.28.2"
  # postcss <8.5.18 vulnerable to GHSA-qx2v-qp2m-jg93 and related
  postcss: "^8.5.18"
  # Security overrides for transitive vulnerabilities
  # linkify-it <=5.0.1 - GHSA-22p9-wv53-3rq4 (quadratic complexity DoS)
  linkify-it: "^5.0.2"
  # ws 6.2.3, 7.5.10, and 8.20.1 - GHSA-96hv-2xvq-fx4p (memory exhaustion DoS)
  "ws@6": "^6.2.4"
  "ws@7": "^7.5.11"
  "ws@8": "^8.21.0"
  # undici <6.27.0 - GHSA-vxpw-j846-p89q, GHSA-p88m-4jfj-68fv, GHSA-35p6-xmwp-9g52, GHSA-g8m3-5g58-fq7m
  undici: "^6.27.0"
  # uuid <11.1.1 - GHSA-w5hq-g745-h8pq (missing buffer bounds checks)
  uuid: "^11.1.1"
  # shell-quote <=1.8.4 - GHSA-w7jw-789q-3m8p (newline escape bypass)
  shell-quote: "^1.9.0"
  # markdown-it <=14.1.1 - GHSA-6v5v-wf23-fmfq (quadratic complexity DoS)
  markdown-it: "^14.2.0"
  # js-yaml <4.3.1 - GHSA-h67p-54hq-rp68
  js-yaml: "^4.3.1"
  # qs <=6.15.1 - GHSA-q8mj-m7cp-5q26 (DoS via stringify)
  qs: "^6.15.2"
  # tar <=7.5.18 - GHSA-vmf3-w455-68vh, GHSA-23hp-3jrh-7fpw
  tar: "^7.5.19"
  # @babel/core <=7.29.0 - GHSA-4x5r-pxfx-6jf8 (arbitrary file read via sourceMappingURL)
  "@babel/core": "^7.29.6"
  # Keep CJS-compatible versions for minimatch used by Expo fingerprinting.
  "brace-expansion@>=2.1.0 <3": "2.0.2"
  "brace-expansion@>=5.0.6": "5.0.5"
  # fast-uri <3.1.5 - host confusion vulnerability
  fast-uri: "^3.1.5"

allowBuilds:
  esbuild: true
